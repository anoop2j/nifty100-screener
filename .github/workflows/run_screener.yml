name: Run Nifty 100 Screener

on:

  workflow_dispatch:

  schedule:

    - cron: '30 11 * * 1-5'

jobs:

  run-python:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Nifty Screener
        run: |
          python nifty_screener.py

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4

        with:
          name: nifty100-report
          path: nifty100_20day_high.html
