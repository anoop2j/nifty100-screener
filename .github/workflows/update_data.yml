name: Update Nifty 100 Stock Data

on:
  # Run every day at 5:00 AM IST
  # GitHub Actions uses UTC
  # 5:00 AM IST = 11:30 PM UTC (previous day)
  schedule:
    - cron: "30 23 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Setup Python
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # Install required Python packages
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # Run Nifty 100 Screener
      # -------------------------------------------------
      - name: Run Nifty Screener
        run: |
          python nifty_screener.py

      # -------------------------------------------------
      # Commit updated data.json
      # -------------------------------------------------
      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update Nifty 100 data"
            git push fi
            git push
          fi
```
