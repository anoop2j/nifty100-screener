<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nifty 100 Screener</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>Nifty 100 Stock Screener</h1>

        <div class="info">

            <div class="card">

                <div class="label">
                    Total Stocks
                </div>

                <div
                    class="value"
                    id="totalStocks"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="label">
                    Last Updated
                </div>

                <div
                    class="value"
                    id="updated"
                >
                    Loading...
                </div>

            </div>

        </div>


        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Stock Code..."
            >

            <button
                onclick="sortByAway()"
            >
                Sort by 20 Day High Away %
            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            Stock Code
                        </th>

                        <th>
                            Yesterday Close
                        </th>

                        <th>
                            20 Day High
                        </th>

                        <th>
                            20 Day High Away %
                        </th>

                        <th>
                            Target Met Yes
                        </th>

                        <th>
                            Target Met No
                        </th>

                        <th>
                            Pending
                        </th>

                        <th>
                            Strike Rate
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="stockTableBody"
                >

                    <tr>

                        <td
                            colspan="9"
                            style="text-align:center;"
                        >
                            Loading data...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script
        src="script.js"
    ></script>

</body>

</html>
